<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Red Bull Slop</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:#101018; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let pig, pipes, running, lastTime;

  function reset() {
    pig = {
      x: W * 0.3,
      y: H * 0.5,
      vy: 0,
      r: 20
    };
    pipes = [ makePipe() ];
    running = true;
    lastTime = performance.now();
  }

  function makePipe() {
    const gap = 200;      // vertical hole size
    const margin = 80;    // keep gap away from screen edges
    const maxGapY = H - margin - gap;
    const gapY = margin + Math.random() * (maxGapY - margin);

    return {
      x: W + 100,
      w: 80,
      gapY,
      gapH: gap
    };
  }

  function flap() {
    if (!running) {
      reset();
      return;
    }
    pig.vy = -9;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  window.addEventListener('pointerdown', flap);

  function update(dt) {
    const g = 20;
    pig.vy += g * dt;
    pig.y += pig.vy;

    const speed = 200;
    for (const p of pipes) {
      p.x -= speed * dt;
    }

    // destroy off‑screen slop
    if (pipes.length && pipes[0].x + pipes[0].w < 0) {
      pipes.shift();
    }

    // keep regenerating so it goes forever
    if (pipes.length < 2) {
      pipes.push(makePipe());
    }

    // collisions with floor/ceiling
    if (pig.y - pig.r < 0 || pig.y + pig.r > H) {
      running = false;
    }

    // collisions with slop columns
    for (const p of pipes) {
      const withinX = pig.x + pig.r > p.x && pig.x - pig.r < p.x + p.w;
      const inGap  = pig.y - pig.r > p.gapY && pig.y + pig.r < p.gapY + p.gapH;
      if (withinX && !inGap) {
        running = false;
      }
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#050509';
    ctx.fillRect(0, 0, W, H);

    // simple slop bubbles
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsla(${200 + Math.random()*80},70%,${20+Math.random()*20}%,0.25)`;
      const r = Math.random()*50;
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      ctx.fillStyle = '#157a2b';

      // top slop
      ctx.fillRect(p.x, 0, p.w, p.gapY);

      // bottom slop
      const bottomY = p.gapY + p.gapH;
      ctx.fillRect(p.x, bottomY, p.w, H - bottomY);
    }
  }

  function drawPig() {
    ctx.fillStyle = '#f8a';
    ctx.beginPath();
    ctx.arc(pig.x, pig.y, pig.r, 0, Math.PI*2);
    ctx.fill();
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('SLOP OVER', W/2, H/2 - 20);

    ctx.font = '20px monospace';
    ctx.fillText('tap or space to try again', W/2, H/2 + 20);
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawPig();
    if (!running) drawGameOver();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    if (running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
