<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Red Bull Slop</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:#101018; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // CONFIG
  const GAP = 260;            // vertical gap size
  const PIPE_WIDTH = 140;     // drawn width of slop
  const PIPE_SPACING = 320;   // base horizontal distance between pipes
  const SPACING_JITTER = 120; // extra random spacing (0..this)
  const PIPE_MARGIN = 80;
  const PIPE_SPEED = 220;
  const GRAVITY = 20;
  const FLAP_STRENGTH = -9;

  // ASSETS
  const pigImg = new Image();
  pigImg.src = 'assets/flying-pig.png';

  const slopImages = [];
  const slopNames = ['slop1', 'slop2', 'slop3', 'slop4', 'slop5', 'slop6']; // will just skip missing
  for (const name of slopNames) {
    const img = new Image();
    img.src = `assets/${name}.png`;
    slopImages.push(img);
  }

  function randomSlopImage() {
    const available = slopImages.filter(img => img.complete && img.naturalWidth > 0);
    if (available.length === 0) return null;
    return available[Math.floor(Math.random() * available.length)];
  }

  let pig, pipes, running, lastTime, score;

  function reset() {
    pig = {
      x: W * 0.28,
      y: H * 0.5,
      vy: 0,
      r: 40
    };
    pipes = [];
    const firstX = W + 200;
    pipes.push(makePipe(firstX));
    running = true;
    lastTime = performance.now();
    score = 0;
  }

  function makePipe(xPos) {
    const maxGapY = H - PIPE_MARGIN - GAP;
    const gapY = PIPE_MARGIN + Math.random() * (maxGapY - PIPE_MARGIN);

    return {
      x: xPos,
      w: PIPE_WIDTH,
      gapY,
      gapH: GAP,
      scored: false,
      topImg: randomSlopImage(),
      bottomImg: randomSlopImage()
    };
  }

  function flap() {
    if (!running) {
      reset();
      return;
    }
    pig.vy = FLAP_STRENGTH;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  window.addEventListener('pointerdown', flap);

  function update(dt) {
    pig.vy += GRAVITY * dt;
    pig.y += pig.vy;

    for (const p of pipes) {
      p.x -= PIPE_SPEED * dt;
    }

    // scoring
    for (const p of pipes) {
      if (!p.scored && p.x + p.w < pig.x) {
        p.scored = true;
        score++;
      }
    }

    // remove off-screen
    while (pipes.length && pipes[0].x + pipes[0].w < -200) {
      pipes.shift();
    }

    // spawn new pipes based on last one's position (no hard limit)
    const last = pipes[pipes.length - 1];
    if (!last || last.x < W - PIPE_SPACING) {
      const baseX = last ? last.x + PIPE_SPACING : W + 200;
      const jitter = Math.random() * SPACING_JITTER;
      pipes.push(makePipe(baseX + jitter));
    }

    // floor / ceiling
    if (pig.y - pig.r < 0 || pig.y + pig.r > H) {
      running = false;
    }

    // collisions
    for (const p of pipes) {
      const withinX = pig.x + pig.r > p.x && pig.x - pig.r < p.x + p.w;
      const inGap  = pig.y - pig.r > p.gapY && pig.y + pig.r < p.gapY + p.gapH;
      if (withinX && !inGap) {
        running = false;
      }
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#050509';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsla(${200 + Math.random()*80},70%,${20+Math.random()*20}%,0.25)`;
      const r = Math.random()*50;
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      const bottomY = p.gapY + p.gapH;

      // top slop
      if (p.topImg && p.topImg.complete && p.topImg.naturalWidth > 0) {
        const scale = p.w / p.topImg.naturalWidth;
        const h = p.gapY;
        const imgH = p.topImg.naturalHeight * scale;
        const reps = Math.ceil(h / imgH);
        for (let i = 0; i < reps; i++) {
          ctx.drawImage(
            p.topImg,
            p.x,
            h - (i + 1) * imgH,
            p.w,
            imgH
          );
        }
      } else {
        ctx.fillStyle = '#157a2b';
        ctx.fillRect(p.x, 0, p.w, p.gapY);
      }

      // bottom slop
      const bottomHeight = H - bottomY;
      if (p.bottomImg && p.bottomImg.complete && p.bottomImg.naturalWidth > 0) {
        const scaleB = p.w / p.bottomImg.naturalWidth;
        const imgHB = p.bottomImg.naturalHeight * scaleB;
        const repsB = Math.ceil(bottomHeight / imgHB);
        for (let i = 0; i < repsB; i++) {
          ctx.drawImage(
            p.bottomImg,
            p.x,
            bottomY + i * imgHB,
            p.w,
            imgHB
          );
        }
      } else {
        ctx.fillStyle = '#157a2b';
        ctx.fillRect(p.x, bottomY, p.w, bottomHeight);
      }
    }
  }

  function drawPig() {
    const px = pig.x;
    const py = pig.y;
    const size = pig.r * 3;

    if (pigImg.complete && pigImg.naturalWidth > 0) {
      ctx.save();
      ctx.translate(px, py);
      ctx.drawImage(
        pigImg,
        -size * 0.5,
        -size * 0.5,
        size,
        size
      );
      ctx.restore();
    } else {
      ctx.fillStyle = '#f8a';
      ctx.beginPath();
      ctx.arc(px, py, pig.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px monospace';
    ctx.fillText(String(score ?? 0), W / 2, 60);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('SLOP OVER', W/2, H/2 - 20);

    ctx.font = '20px monospace';
    ctx.fillText('tap or space to try again', W/2, H/2 + 20);
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawPig();
    drawHUD();
    if (!running) drawGameOver();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    if (running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
