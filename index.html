<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Red Bull Slop</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:#101018; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let pig, pipes, running, lastTime;

  function reset() {
    pig = {
      x: W * 0.3,
      y: H * 0.5,
      vy: 0,
      r: 20
    };
    pipes = [
      makePipe()
    ];
    running = true;
    lastTime = performance.now();
  }

  function makePipe() {
    const gap = 180;
    const minGapY = 80;
    const maxGapY = H - 80 - gap;
    const gapY = minGapY + Math.random() * (maxGapY - minGapY);
    return {
      x: W + 100,
      w: 80,
      gapY,
      gapH: gap
    };
  }

  function flap() {
    if (!running) {
      reset();
      return;
    }
    pig.vy = -9;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  window.addEventListener('pointerdown', flap);

  function update(dt) {
    const g = 20; // gravity
    pig.vy += g * dt;
    pig.y += pig.vy;

    const speed = 200;
    for (const p of pipes) {
      p.x -= speed * dt;
    }
    if (pipes[0].x + pipes[0].w < 0) {
      pipes.shift();
    }
    if (pipes.length < 2) {
      pipes.push(makePipe());
    }

    // collisions
    if (pig.y - pig.r < 0 || pig.y + pig.r > H) {
      running = false;
    }
    for (const p of pipes) {
      if (pig.x + pig.r > p.x && pig.x - pig.r < p.x + p.w) {
        if (pig.y - pig.r < p.gapY || pig.y + pig.r > p.gapY + p.gapH) {
          running = false;
        }
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#050509';
    ctx.fillRect(0, 0, W, H);

    // slop background
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsla(${200 + Math.random()*80},70%,${20+Math.random()*20}%,0.25)`;
      const r = Math.random()*50;
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, r, 0, Math.PI*2);
      ctx.fill();
    }

    // pipes (slop columns)
    for (const p of pipes) {
      ctx.fillStyle = '#3f8';
      ctx.fillRect(p.x, 0, p.w, p.gapY);
      ctx.fillRect(p.x, p.gapY + p.gapH, p.w, H - p.gapY - p.gapH);
    }

    // pig (placeholder circle)
    ctx.fillStyle = '#f8a';
    ctx.beginPath();
    ctx.arc(pig.x, pig.y, pig.r, 0, Math.PI*2);
    ctx.fill();

    if (!running) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SLOP OVER', W/2, H/2 - 20);
      ctx.font = '20px monospace';
      ctx.fillText('tap or space to try again', W/2, H/2 + 20);
    }
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    if (running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
