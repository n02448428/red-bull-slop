<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Red Bull Slop</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:#101018; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // CONFIG
  const GAP = 260;          // vertical hole size (bigger = easier)
  const PIPE_WIDTH = 90;
  const PIPE_SPACING = 320; // horizontal distance between pipes
  const PIPE_MARGIN = 80;   // vertical margin from top/bottom
  const PIPE_SPEED = 220;   // px/sec
  const GRAVITY = 20;
  const FLAP_STRENGTH = -9;

  let pig, pipes, running, lastTime, score;

  function reset() {
    pig = {
      x: W * 0.3,
      y: H * 0.5,
      vy: 0,
      r: 22
    };
    pipes = [];
    // spawn two pipes to start
    const firstX = W + 200;
    pipes.push(makePipe(firstX));
    pipes.push(makePipe(firstX + PIPE_SPACING));
    running = true;
    lastTime = performance.now();
    score = 0;
  }

  function makePipe(xPos) {
    const maxGapY = H - PIPE_MARGIN - GAP;
    const gapY = PIPE_MARGIN + Math.random() * (maxGapY - PIPE_MARGIN);

    return {
      x: xPos,
      w: PIPE_WIDTH,
      gapY,
      gapH: GAP,
      scored: false
    };
  }

  function flap() {
    if (!running) {
      reset();
      return;
    }
    pig.vy = FLAP_STRENGTH;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  window.addEventListener('pointerdown', flap);

  function update(dt) {
    // pig physics
    pig.vy += GRAVITY * dt;
    pig.y += pig.vy;

    // move pipes
    for (const p of pipes) {
      p.x -= PIPE_SPEED * dt;
    }

    // scoring: when pig passes pipe completely
    for (const p of pipes) {
      if (!p.scored && p.x + p.w < pig.x) {
        p.scored = true;
        score++;
      }
    }

    // remove off-screen pipes
    while (pipes.length && pipes[0].x + pipes[0].w < -50) {
      pipes.shift();
    }

    // ensure we always have two pipes ahead
    while (pipes.length < 2) {
      const last = pipes[pipes.length - 1];
      const newX = last ? last.x + PIPE_SPACING : W + 200;
      pipes.push(makePipe(newX));
    }

    // collisions with floor/ceiling
    if (pig.y - pig.r < 0 || pig.y + pig.r > H) {
      running = false;
    }

    // collisions with pipes
    for (const p of pipes) {
      const withinX = pig.x + pig.r > p.x && pig.x - pig.r < p.x + p.w;
      const inGap  = pig.y - pig.r > p.gapY && pig.y + pig.r < p.gapY + p.gapH;
      if (withinX && !inGap) {
        running = false;
      }
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#050509';
    ctx.fillRect(0, 0, W, H);

    // simple slop bubbles
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsla(${200 + Math.random()*80},70%,${20+Math.random()*20}%,0.25)`;
      const r = Math.random()*50;
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      ctx.fillStyle = '#157a2b';

      // top slop
      ctx.fillRect(p.x, 0, p.w, p.gapY);

      // bottom slop
      const bottomY = p.gapY + p.gapH;
      ctx.fillRect(p.x, bottomY, p.w, H - bottomY);
    }
  }

  function drawPig() {
    ctx.fillStyle = '#f8a';
    ctx.beginPath();
    ctx.arc(pig.x, pig.y, pig.r, 0, Math.PI*2);
    ctx.fill();
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px monospace';
    ctx.fillText(String(score ?? 0), W / 2, 60);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('SLOP OVER', W/2, H/2 - 20);

    ctx.font = '20px monospace';
    ctx.fillText('tap or space to try again', W/2, H/2 + 20);
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawPig();
    drawHUD();
    if (!running) drawGameOver();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    if (running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
